<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Từ Vựng Tiếng Anh</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        input, select, button { padding: 10px; margin: 10px 0; width: 100%; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .question-block { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; }
        .hidden { display: none; }
        .matching-container { display: flex; justify-content: space-between; }
        .match-list { width: 45%; list-style: none; padding: 0; }
        .match-item { padding: 10px; background: #ecf0f1; margin-bottom: 5px; border-radius: 5px; cursor: pointer; text-align: center; }
        .match-item.selected { background: #f1c40f; }
        .match-item.matched { background: #2ecc71; color: white; pointer-events: none; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="card">
        <h1>Vào thi Từ Vựng</h1>
        <label>Họ và Tên của em:</label>
        <input type="text" id="studentName" placeholder="Nhập tên vào đây..." required>
        
        <label>Chọn Unit bài tập:</label>
        <select id="unitSelect">
            <option value="Unit 1">Unit 1</option>
            <option value="Unit 2">Unit 2</option>
        </select>
        
        <button onclick="startTest()">Bắt đầu làm bài</button>
        <p id="loadingText" class="hidden" style="text-align: center; color: #e67e22;">Đang tải đề thi từ Google Sheets...</p>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="test-screen" class="card hidden">
        <h2 id="test-title">Đề thi</h2>
        <div id="questions-container"></div>
        <button onclick="submitTest()" style="background-color: #27ae60;">Nộp bài & Xem điểm</button>
    </div>

    <script>
        // BẠN HÃY DÁN LINK WEB APP GOOGLE SCRIPT CỦA BẠN VÀO ĐÂY !!!
        const API_URL = "https://script.google.com/macros/s/AKfycbzabp_kl5-WJNjMUP9t7OsidBsPVrm2MK5fW-7BukU4jO4D35dsy0L6CZu4de2nweTsBA/exec"; 
        
        let vocabData = [];
        let score = 0;
        let totalQuestions = 0;

        async function startTest() {
            const name = document.getElementById("studentName").value;
            const unit = document.getElementById("unitSelect").value;
            if (!name) return alert("Vui lòng nhập tên!");

            document.getElementById("loadingText").classList.remove("hidden");

            try {
                // Gọi API lấy từ vựng từ Google Sheet
                const response = await fetch(`${API_URL}?unit=${unit}`);
                vocabData = await response.json();
                
                if(vocabData.length === 0) {
                    alert("Chưa có từ vựng nào trong Unit này trên Sheet!");
                    document.getElementById("loadingText").classList.add("hidden");
                    return;
                }

                totalQuestions = vocabData.length;
                generateQuestions();

                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("test-screen").classList.remove("hidden");
                document.getElementById("test-title").innerText = `Bài làm của: ${name} - ${unit}`;
            } catch (error) {
                alert("Lỗi khi tải dữ liệu. Hãy kiểm tra lại Link API.");
            }
        }

        function generateQuestions() {
            const container = document.getElementById("questions-container");
            container.innerHTML = "";
            
            // Hàm xáo trộn mảng
            const shuffled = [...vocabData].sort(() => 0.5 - Math.random());
            
            // Chia dữ liệu làm 2 phần (Phần 1: Điền từ, Phần 2: Trắc nghiệm nghĩa). 
            // Dạng Nối từ cần code phức tạp hơn một chút nên ở bản demo này mình gộp vào Trắc nghiệm cho web chạy nhẹ nhàng nhất.
            const part1 = shuffled.slice(0, Math.ceil(shuffled.length / 2));
            const part2 = shuffled.slice(Math.ceil(shuffled.length / 2));

            // Dạng 1: Điền chữ cái khuyết (VD: a_azi_g)
            container.innerHTML += `<h3>Phần 1: Điền chữ cái còn thiếu</h3>`;
            part1.forEach((item, index) => {
                // Tạo chữ khuyết bằng cách thay thế các nguyên âm (a,e,i,o,u) thành dấu _
                let hiddenWord = item.word.replace(/[aeiou]/ig, '_'); 
                
                container.innerHTML += `
                    <div class="question-block" data-type="fill" data-answer="${item.word.toLowerCase()}">
                        <p><b>Câu ${index + 1}:</b> Nghĩa là "${item.meaning}". Từ này viết là: <b>${hiddenWord}</b></p>
                        <input type="text" class="answer-input" placeholder="Viết từ hoàn chỉnh...">
                    </div>
                `;
            });

            // Dạng 2: Trắc nghiệm nghĩa Tiếng Việt
            container.innerHTML += `<h3>Phần 2: Chọn nghĩa đúng</h3>`;
            part2.forEach((item, index) => {
                // Tạo đáp án sai ngẫu nhiên
                let options = [item.meaning];
                while(options.length < 4 && vocabData.length >= 4) {
                    let randomMeaning = vocabData[Math.floor(Math.random() * vocabData.length)].meaning;
                    if(!options.includes(randomMeaning)) options.push(randomMeaning);
                }
                options.sort(() => 0.5 - Math.random()); // Xáo trộn đáp án

                let optionsHTML = options.map(opt => `
                    <label style="display:block; margin: 5px 0;">
                        <input type="radio" name="q_${item.word}" value="${opt}"> ${opt}
                    </label>
                `).join("");

                container.innerHTML += `
                    <div class="question-block" data-type="choice" data-answer="${item.meaning}">
                        <p><b>Câu ${part1.length + index + 1}:</b> Từ <b>"${item.word}"</b> có nghĩa là gì?</p>
                        ${optionsHTML}
                    </div>
                `;
            });
        }

        async function submitTest() {
            score = 0;
            const blocks = document.querySelectorAll(".question-block");
            
            blocks.forEach(block => {
                const type = block.getAttribute("data-type");
                const correctAnswer = block.getAttribute("data-answer");

                if (type === "fill") {
                    const studentAnswer = block.querySelector(".answer-input").value.trim().toLowerCase();
                    if (studentAnswer === correctAnswer) score++;
                } else if (type === "choice") {
                    const selected = block.querySelector("input[type='radio']:checked");
                    if (selected && selected.value === correctAnswer) score++;
                }
            });

            const finalScore = `${score}/${totalQuestions}`;
            alert(`Bạn đã đúng ${finalScore} câu! Đang nộp bài...`);

            // Gửi dữ liệu về Google Sheets
            const resultData = {
                studentName: document.getElementById("studentName").value,
                unit: document.getElementById("unitSelect").value,
                score: finalScore
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(resultData)
                });
                alert("Nộp bài thành công! Thầy đã nhận được kết quả.");
                location.reload(); // Tải lại trang
            } catch (error) {
                alert("Đã có lỗi xảy ra khi nộp bài. Lỗi CORS hoặc mạng.");
            }
        }
    </script>
</body>
</html>
