<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floria English - Thử thách Từ Vựng</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            /* Nền màu xanh pastel nhạt cực kỳ êm mắt */
            background-color: #f0f7ff; 
            background-image: radial-gradient(#c2dffc 3px, transparent 3px);
            background-size: 40px 40px;
            min-height: 100vh; margin: 0; padding: 20px; 
            display: flex; justify-content: center; align-items: flex-start;
            color: #4a4a4a;
        }
        .container { width: 100%; max-width: 700px; margin-top: 35px; }
        
        .card { 
            background: white; padding: 35px; border-radius: 35px; 
            box-shadow: 0 12px 0 #c2dffc, 0 15px 25px rgba(0,0,0,0.1); 
            margin-bottom: 30px; border: 4px solid #fff;
        }

        /* --- CSS CHO LOGO FLORIA ENGLISH --- */
        .logo-container {
            text-align: center;
            margin-bottom: -15px;
            position: relative;
            z-index: 10;
        }
        .class-logo {
            width: 130px; /* To hơn xíu để rõ chữ Floria */
            height: 130px;
            border-radius: 50%;
            border: 6px solid #69a7eb; /* Màu xanh của chữ Floria */
            box-shadow: 0 8px 0 #4a8adb, 0 15px 20px rgba(0,0,0,0.1);
            object-fit: cover;
            background-color: white;
            transition: transform 0.3s;
        }
        .class-logo:hover {
            transform: scale(1.1) rotate(5deg);
        }
        /* ------------------- */
        
        h1 { color: #69a7eb; text-align: center; font-weight: 800; font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 0px #c2dffc;}
        h2 { color: #f39c12; text-align: center; font-size: 26px; border-bottom: 3px dashed #c8d6e5; padding-bottom: 15px; font-weight: 800;}
        h3 { 
            color: white; font-size: 18px; margin-top: 30px; 
            background: #69a7eb; display: inline-block; padding: 8px 20px; 
            border-radius: 25px; box-shadow: 0 5px 0 #4a8adb; font-weight: 700;
        }
        
        label { font-weight: 800; color: #576574; margin-top: 20px; display: block; font-size: 18px;}
        
        input[type="text"], select { 
            padding: 16px; margin: 12px 0 25px 0; width: 100%; box-sizing: border-box;
            border-radius: 20px; border: 3px solid #c2dffc; font-size: 18px; 
            font-family: 'Quicksand', sans-serif; font-weight: 700; color: #34495e;
            transition: all 0.3s; background-color: #f8fbff;
        }
        input[type="text"]:focus, select:focus { 
            border-color: #69a7eb; outline: none; background-color: white;
            box-shadow: 0 0 0 5px rgba(105, 167, 235, 0.3); 
        }
        
        button { 
            background: #69a7eb; color: white; border: none; cursor: pointer; 
            font-weight: 800; font-size: 20px; padding: 18px; width: 100%; 
            border-radius: 25px; transition: all 0.1s;
            box-shadow: 0 8px 0 #4a8adb; font-family: 'Quicksand', sans-serif;
            margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { filter: brightness(1.05); }
        button:active { transform: translateY(8px); box-shadow: 0 0 0 #4a8adb; } 
        button:disabled { background: #c8d6e5; box-shadow: 0 8px 0 #8395a7; cursor: not-allowed; transform: none; }
        
        .btn-submit { 
            background: #ffd359; /* Màu vàng từ các ngôi sao trong logo */
            color: #d35400; /* Chữ màu cam đậm cho dễ đọc */
            box-shadow: 0 8px 0 #eebb30; margin-top: 30px; 
        }
        .btn-submit:active { transform: translateY(8px); box-shadow: 0 0 0 #eebb30; }
        
        .question-block { 
            background: #ffffff; padding: 25px; border-radius: 25px; 
            margin-bottom: 25px; border: 3px solid #c2dffc;
            position: relative; box-shadow: 0 5px 15px rgba(105, 167, 235, 0.08);
        }
        .question-block p { margin: 0 0 15px 0; color: #2f3640; font-size: 18px; font-weight: 700;}
        .hint-text { color: #69a7eb; font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 3px; background: white; padding: 10px; border-radius: 15px; border: 2px dashed #69a7eb;}
        
        .option-label {
            display: block; padding: 15px 20px; margin-bottom: 12px; background: white; 
            border: 3px solid #c2dffc; border-radius: 20px; cursor: pointer; 
            transition: all 0.2s; font-weight: 700; font-size: 17px; color: #576574;
        }
        .option-label:hover { border-color: #69a7eb; background: #f0f7ff; transform: scale(1.02); }
        
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + span { color: #69a7eb; font-weight: 800; }
        .option-label:has(input[type="radio"]:checked) { border-color: #69a7eb; background: #f0f7ff; box-shadow: 0 4px 0 #69a7eb;}

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="card">
        
        <!-- LOGO CỦA TRUNG TÂM/LỚP HỌC -->
        <div class="logo-container">
            <!-- Web sẽ tự động tải file logo.jpg mà bạn vừa up lên GitHub -->
            <img src="logo.jpg" alt="Floria English Logo" class="class-logo">
        </div>

        <h1>Floria English 🎓</h1>
        
        <label>Tên của nhà thám hiểm là gì nhỉ? 🐻</label>
        <input type="text" id="studentName" placeholder="Ví dụ: Lớp trưởng Nobita..." required>
        
        <label>Chọn bản đồ kho báu: 🗺️</label>
        <select id="unitSelect">
            <option value="">⏳ Đang tìm kiếm kho báu...</option>
        </select>
        
        <button id="startBtn" onclick="startTest()" disabled>Đang chuẩn bị tàu bay... 🚀</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="test-screen" class="card hidden">
        <h2 id="test-title">Thử thách bắt đầu! ⚔️</h2>
        <div id="questions-container"></div>
        <button class="btn-submit" onclick="submitTest()">🏆 Nộp bài & Nhận thưởng</button>
    </div>
</div>

<script>

    const API_URL = "https://script.google.com/macros/s/AKfycbw33V_isll0Crp6AqJwA2J6uePPAIbPcwRfLf8pM3DL5BRiPX-5msdimvD0ijD3SQw-EQ/exec"; 
    
    let allVocab = []; 
    let testVocab = []; 
    let totalQuestions = 0;

    window.onload = async function() {
        const select = document.getElementById("unitSelect");
        const btn = document.getElementById("startBtn");

        try {
            const response = await fetch(API_URL);
            allVocab = await response.json();
            
            const units = [...new Set(allVocab.map(item => item.unit))];
            
            select.innerHTML = ""; 
            if (units.length === 0) {
                select.innerHTML = '<option value="">Thầy chưa nạp kho báu nào cả! 😅</option>';
            } else {
                units.forEach(unit => {
                    select.innerHTML += `<option value="${unit}">🌟 ${unit}</option>`;
                });
                btn.disabled = false;
                btn.innerText = "Bắt đầu phiêu lưu! 🚀";
            }
        } catch (error) {
            select.innerHTML = '<option value="">Ối! Đứt mạng rồi! 😭</option>';
            alert("Không tải được danh sách bài học. Em hãy tải lại trang nhé.");
        }
    };

    function startTest() {
        const name = document.getElementById("studentName").value.trim();
        const selectedUnit = document.getElementById("unitSelect").value;
        
        if (!name) return alert("Em quên nhập tên kìa! Nhập tên để thầy còn trao thưởng chứ 🎁");
        if (!selectedUnit) return alert("Hệ thống chưa tải xong, đợi xíu nha! ⏳");

        let unitVocab = allVocab.filter(item => item.unit === selectedUnit);
        
        if(unitVocab.length === 0) {
            return alert("Bài này chưa có từ vựng nào cả!");
        }

        let shuffled = [...unitVocab].sort(() => 0.5 - Math.random());
        testVocab = shuffled.slice(0, 30);
        totalQuestions = testVocab.length;

        generateQuestions(unitVocab); 

        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("test-screen").classList.remove("hidden");
        document.getElementById("test-title").innerText = `Thám hiểm: ${selectedUnit} 🧭`;
        window.scrollTo(0, 0); // Tự động cuộn lên đầu trang khi bắt đầu làm bài
    }

    function generateQuestions(fullUnitVocab) {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";
        
        const part1 = testVocab.slice(0, Math.ceil(testVocab.length / 2));
        const part2 = testVocab.slice(Math.ceil(testVocab.length / 2));

        container.innerHTML += `<h3>🎯 Trạm 1: Tìm chữ cái đi lạc</h3>`;
        part1.forEach((item, index) => {
            let hiddenWord = item.word.replace(/[aeiou]/ig, '_'); 
            container.innerHTML += `
                <div class="question-block" data-type="fill" data-word="${item.word}" data-answer="${item.word.toLowerCase()}">
                    <p><b>Câu ${index + 1}:</b> Nghĩa là "<b>${item.meaning}</b>".</p>
                    <p class="hint-text">${hiddenWord}</p>
                    <input type="text" class="answer-input" placeholder="Viết lại từ tiếng Anh đúng...">
                </div>
            `;
        });

        container.innerHTML += `<h3>🧠 Trạm 2: Giải mã từ vựng</h3>`;
        part2.forEach((item, index) => {
            let options = [item.meaning];
            
            while(options.length < 4 && fullUnitVocab.length >= 4) {
                let randomMeaning = fullUnitVocab[Math.floor(Math.random() * fullUnitVocab.length)].meaning;
                if(!options.includes(randomMeaning)) options.push(randomMeaning);
            }
            options.sort(() => 0.5 - Math.random()); 

            let optionsHTML = options.map(opt => `
                <label class="option-label">
                    <input type="radio" name="q_${item.word}" value="${opt}">
                    <span>${opt}</span>
                </label>
            `).join("");

            container.innerHTML += `
                <div class="question-block" data-type="choice" data-word="${item.word}" data-answer="${item.meaning}">
                    <p><b>Câu ${part1.length + index + 1}:</b> Từ "<b>${item.word}</b>" có nghĩa là gì nhỉ?</p>
                    ${optionsHTML}
                </div>
            `;
        });
    }

    async function submitTest() {
        let score = 0;
        let wrongDetails = []; 
        const blocks = document.querySelectorAll(".question-block");
        
        blocks.forEach(block => {
            const type = block.getAttribute("data-type");
            const correctAnswer = block.getAttribute("data-answer");
            const word = block.getAttribute("data-word"); 

            if (type === "fill") {
                const studentAnswer = block.querySelector(".answer-input").value.trim().toLowerCase();
                if (studentAnswer === correctAnswer) {
                    score++;
                } else {
                    wrongDetails.push(`[Điền từ] ${word}: Khách làm "${studentAnswer || 'bỏ trống'}"`);
                }
            } else if (type === "choice") {
                const selected = block.querySelector("input[type='radio']:checked");
                if (selected && selected.value === correctAnswer) {
                    score++;
                } else {
                    const ans = selected ? selected.value : 'bỏ trống';
                    wrongDetails.push(`[Trắc nghiệm] ${word}: Chọn "${ans}"`);
                }
            }
        });

        const finalScore = `${score}/${totalQuestions}`;
        
        let message = "";
        if (score === totalQuestions) message = "Tuyệt đỉnh! 100 điểm không có nhưng! 🎉";
        else if (score >= totalQuestions / 2) message = "Làm tốt lắm! Cố gắng thêm xíu nữa nha! 🌟";
        else message = "Không sao đâu, lần sau tụi mình phục thù nhé! 💪";
        
        alert(`${message}\n\nEm làm đúng ${finalScore} câu. Nhấn OK để gửi điểm cho Thầy nhé!`);

        const detailString = wrongDetails.length === 0 ? "Đúng 100%" : wrongDetails.join(" | ");

        const resultData = {
            studentName: document.getElementById("studentName").value,
            unit: document.getElementById("unitSelect").value,
            score: finalScore,
            details: detailString 
        };

        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(resultData)
            });
            alert("Chim bồ câu đã gửi điểm cho Thầy thành công! 🕊️");
            location.reload(); 
        } catch (error) {
            alert("Lỗi mạng rồi, chim bồ câu bị lạc. Em hãy thử nộp lại nha! 🌪️");
        }
    }
</script>
</body>
</html>
